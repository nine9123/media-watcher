<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Media Watcher</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a href="#/" class="brand">▶ Watcher</a>
  <nav id="libs"></nav>
  <form id="search-form" role="search">
    <input id="search" type="search" placeholder="Search" autocomplete="off">
  </form>
  <button id="scan-btn" class="ghost" title="Rescan libraries">⟳</button>
  <span id="scan-status"></span>
</header>
<main id="view"></main>

<div id="login" hidden>
  <form id="login-form">
    <h1>▶ Watcher</h1>
    <input id="login-key" type="password" placeholder="API key" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="player" hidden>
  <video id="video" playsinline preload="auto"></video>
  <div id="spinner" hidden></div>
  <div id="p-top" class="p-ui">
    <button id="p-back" class="ghost" title="Back (Esc)">←</button>
    <div class="p-titles"><div id="p-title"></div><div id="p-sub"></div></div>
    <span id="p-mode" class="badge"></span>
  </div>
  <div id="p-error" hidden></div>
  <div id="p-next-overlay" hidden>
    <div>Up next: <b id="p-next-title"></b></div>
    <div class="row"><button id="p-next-now">Play now</button><button id="p-next-cancel" class="ghost">Cancel</button></div>
  </div>
  <div id="p-bottom" class="p-ui">
    <div id="p-seek"><div id="p-buffer"></div><div id="p-played"></div><div id="p-hover" hidden></div></div>
    <div class="p-row">
      <button id="p-prev" class="ghost" title="Previous">⏮</button>
      <button id="p-play" class="ghost" title="Play/Pause (Space)">▶</button>
      <button id="p-next" class="ghost" title="Next (N)">⏭</button>
      <span id="p-time">0:00 / 0:00</span>
      <span class="spacer"></span>
      <input id="p-volume" type="range" min="0" max="1" step="0.05" title="Volume">
      <div class="menu-wrap">
        <button id="p-audio-btn" class="ghost" title="Audio track">🔊</button>
        <div id="p-audio-menu" class="menu" hidden></div>
      </div>
      <a id="p-download" class="ghost btn" title="Download original file">⤓</a>
      <button id="p-fs" class="ghost" title="Fullscreen (F)">⛶</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
