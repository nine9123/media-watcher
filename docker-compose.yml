services:
  watcher:
    build: .
    container_name: media-watcher
    restart: unless-stopped
    # Any uid/gid that can read the media and write the cache/config dirs.
    user: "1000:1000"
    ports:
      - "8097:8097"
    environment:
      # Put API_KEY in a .env file next to this one (see .env.example).
      API_KEY: ${API_KEY:?set API_KEY in .env}
      # Every folder directly under /media becomes a library, type auto-detected.
      # To be explicit instead:
      # LIBRARIES: "Anime=/media/anime:shows;Series=/media/tv:shows;Movies=/media/movies:movies"
      AUDIO_LANGUAGES: "jpn,ja,japanese"
      AUDIO_CHANNELS: "2"
      HWACCEL: "none"   # "vaapi" together with the devices/group_add below
      SCAN_INTERVAL: "1800"
      # Posters and descriptions: TMDB first (needs TMDB_API_KEY in .env), then
      # AniList (no key). METADATA_SOURCES: "" turns lookups off.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      METADATA_SOURCES: "tmdb,anilist"
    volumes:
      - /path/to/media:/media:ro                 # your library, read-only
      - /path/to/ssd/media-watcher/cache:/cache  # disposable: db + thumbnails
      - ./config:/config                         # watch progress, keep this
    # Intel/AMD hardware transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "video"   # or the numeric gid owning /dev/dri/renderD128
