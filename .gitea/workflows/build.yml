name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: gitea.internal:30008
  IMAGE_NAME: nine9/media-watcher
  # Passed to the Dockerfile's EXTRA_PACKAGES build arg: Debian packages on
  # top of ffmpeg. The Intel (iHD) and AMD VAAPI drivers are already in the
  # image by default; for an Intel iGPU older than Broadwell add
  # "i965-va-driver".
  EXTRA_PACKAGES: ""
  # Images for the Dockerfile's two stages: the runtime base and the Go
  # toolchain that builds the binary. Default to Docker Hub; set the
  # repository variables BASE_IMAGE / GO_IMAGE to a mirror or a copy in the
  # Gitea registry if the runner can't reach Docker Hub reliably.
  BASE_IMAGE: ${{ vars.BASE_IMAGE || 'debian:trixie-slim' }}
  GO_IMAGE: ${{ vars.GO_IMAGE || 'golang:1.23-bookworm' }}
  # The default TMDB key baked into the image comes from the repository
  # secret TMDB_API_KEY (a free key from themoviedb.org). Without the secret
  # the image has no default and posters come from AniList only, unless the
  # container sets TMDB_API_KEY itself.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # Docker Hub from the runner times out now and then (TLS handshake
      # timeout on auth.docker.io). Pull both images with retries first;
      # the build then uses the local copies instead of going back to the hub.
      - name: Pull base images
        run: |
          pull() {
            for attempt in 1 2 3 4 5; do
              if docker pull --platform linux/amd64 "$1"; then
                return 0
              fi
              echo "Pull attempt ${attempt} of $1 failed, retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
            echo "Could not pull $1 after 5 attempts" >&2
            return 1
          }
          pull "${{ env.BASE_IMAGE }}"
          pull "${{ env.GO_IMAGE }}"

      - name: Build image
        run: |
          SHA_SHORT=$(echo "${{ gitea.sha }}" | cut -c1-8)
          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE="${{ env.BASE_IMAGE }}" \
            --build-arg GO_IMAGE="${{ env.GO_IMAGE }}" \
            --build-arg EXTRA_PACKAGES="${{ env.EXTRA_PACKAGES }}" \
            --build-arg TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_SHORT} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          echo "SHA_SHORT=${SHA_SHORT}" >> "$GITEA_ENV"

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
